name: Strict kit verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    name: ${{ matrix.name }} / Python 3.10.21
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            key: linux-x64
            os: ubuntu-24.04
            godot_archive: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_executable: Godot_v4.7.2-stable_linux.x86_64
          - name: Windows x64
            key: windows-x64
            os: windows-2025
            godot_archive: Godot_v4.7.2-stable_win64.exe.zip
            godot_executable: Godot_v4.7.2-stable_win64_console.exe
          - name: macOS universal
            key: macos-universal
            os: macos-15
            godot_archive: Godot_v4.7.2-stable_macos.universal.zip
            godot_executable: Godot.app/Contents/MacOS/Godot

    steps:
      # Official GitHub actions, pinned to immutable release commits.
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # https://github.com/actions/setup-python/releases/tag/v7.0.0
      - name: Set up the declared minimum Python line
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.10.21
          check-latest: false

      # https://github.com/actions/setup-node/releases/tag/v7.0.0
      - name: Set up current Node LTS for the DOM harness
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Run kit control-plane tests with the native engine disabled
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./kit self-test

      - name: Run kit control-plane tests through the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\kit.cmd self-test

      - name: Authenticate every canonical third-party lock source
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./kit setup audit-dependencies

      - name: Authenticate every canonical third-party lock source on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\kit.cmd setup audit-dependencies

      - name: Install the locked GDScript tool through the public kit launcher
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./kit setup dependency gdtoolkit

      - name: Install the locked GDScript tool through the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\kit.cmd setup dependency gdtoolkit

      - name: Download and authenticate the official Godot build
        shell: python
        env:
          GODOT_ARCHIVE: ${{ matrix.godot_archive }}
          GODOT_EXECUTABLE: ${{ matrix.godot_executable }}
          GODOT_RELEASE: 4.7.2-stable
        run: |
          import hashlib
          import os
          import pathlib
          import shutil
          import stat
          import urllib.request
          import zipfile

          release = os.environ["GODOT_RELEASE"]
          archive_name = os.environ["GODOT_ARCHIVE"]
          executable_name = os.environ["GODOT_EXECUTABLE"]
          base = f"https://github.com/godotengine/godot-builds/releases/download/{release}"
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "official-godot"
          destination.mkdir(parents=True, exist_ok=True)
          archive = destination / archive_name
          sums = destination / "SHA512-SUMS.txt"

          def download(url, target):
              request = urllib.request.Request(url, headers={"User-Agent": "godot-agent-kit-ci"})
              with urllib.request.urlopen(request, timeout=180) as source, target.open("wb") as output:
                  shutil.copyfileobj(source, output)

          download(f"{base}/{archive_name}", archive)
          download(f"{base}/SHA512-SUMS.txt", sums)
          expected = None
          for line in sums.read_text(encoding="utf-8").splitlines():
              fields = line.split()
              listed = fields[-1].lstrip("*") if len(fields) >= 2 else ""
              if listed.startswith("./"):
                  listed = listed[2:]
              if listed == archive_name:
                  expected = fields[0].lower()
                  break
          if expected is None or len(expected) != 128:
              raise SystemExit(f"official SHA512-SUMS.txt has no valid entry for {archive_name}")
          digest = hashlib.sha512()
          with archive.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f"Godot archive checksum mismatch: {actual} != {expected}")

          with zipfile.ZipFile(archive) as source:
              total_size = 0
              for member in source.infolist():
                  raw_name = member.filename
                  relative = pathlib.PurePosixPath(raw_name)
                  unix_mode = (member.external_attr >> 16) & 0xFFFF
                  if (
                      not raw_name
                      or "\\" in raw_name
                      or relative.is_absolute()
                      or any(part in ("", ".", "..") or ":" in part for part in relative.parts)
                      or stat.S_ISLNK(unix_mode)
                  ):
                      raise SystemExit(f"unsafe Godot archive member: {raw_name!r}")
                  total_size += member.file_size
                  if member.file_size > 512 * 1024 * 1024 or total_size > 1024 * 1024 * 1024:
                      raise SystemExit("Godot archive expands beyond the supported bound")
                  target = (destination / pathlib.Path(*relative.parts)).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise SystemExit(f"Godot archive member escapes destination: {raw_name!r}")
                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with source.open(member) as input_file, target.open("wb") as output_file:
                      shutil.copyfileobj(input_file, output_file)
          executable = (destination / pathlib.PurePosixPath(executable_name)).resolve()
          if not executable.is_file() or not executable.is_relative_to(destination.resolve()):
              raise SystemExit(f"expected Godot executable is absent: {executable}")
          executable.chmod(executable.stat().st_mode | stat.S_IXUSR)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as github_env:
              github_env.write(f"GODOT_BIN={executable}\n")

      - name: Run strict production verification through the public kit launcher
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./kit verify --strict --json

      - name: Run strict production verification through the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\kit.cmd verify --strict --json

      # Keep the dependency surface to GitHub's checkout/setup actions. Strict
      # verification already retains complete logs locally; print them on any
      # outcome so the immutable job log preserves the evidence without an
      # artifact-upload dependency.
      - name: Print retained strict evidence
        if: ${{ always() }}
        shell: python
        run: |
          import pathlib
          root = pathlib.Path(".kit/runtime/verification")
          if not root.is_dir():
              raise SystemExit("strict verification produced no evidence directory")
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.suffix in {".json", ".log"}:
                  print(f"\n===== {path.as_posix()} =====")
                  print(path.read_text(encoding="utf-8", errors="replace"), end="")
